<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Agenda</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17727c">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* Layout: calendar on the left (month/week/day as tabs), collapsible to-do sidebar on the right. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18202c; --muted:#667085; --line:#e2e6ec;
  --accent:#17727c; --accent-ink:#ffffff; --today:#e6f3f4; --sel:#d3eaec;
  --c-blue:#3b6fd4; --c-green:#2e9a68; --c-orange:#d4811f; --c-red:#cc4848; --c-purple:#8657cf; --c-black:#1c2530;
  --shadow:0 8px 28px rgba(20,30,50,.16);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --surface:#181e27; --ink:#e8ecf3; --muted:#9aa4b6; --line:#2a323f;
    --accent:#4fb6c1; --accent-ink:#0b1417; --today:#17303a; --sel:#1f4450;
    --c-blue:#6c9bf2; --c-green:#52c28f; --c-orange:#eba24a; --c-red:#ee7a7a; --c-purple:#ac85ec; --c-black:#aab4c1;
    --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#181e27; --ink:#e8ecf3; --muted:#9aa4b6; --line:#2a323f;
  --accent:#4fb6c1; --accent-ink:#0b1417; --today:#17303a; --sel:#1f4450;
  --c-blue:#6c9bf2; --c-green:#52c28f; --c-orange:#eba24a; --c-red:#ee7a7a; --c-purple:#ac85ec; --c-black:#aab4c1;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title{font:700 20px/1.1 var(--f-display);margin:0 4px 0 0;min-width:0;flex:1 1 220px;text-wrap:balance;text-transform:capitalize}
.title small{display:block;font:500 12px var(--f-body);color:var(--muted);text-transform:none;margin-top:3px}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:7px 10px;line-height:1}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.18)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;text-align:center}
.btn[aria-expanded="true"]{background:var(--sel);border-color:var(--accent)}

/* Main area */
.main{flex:1;min-height:0;display:flex;position:relative}
.cal{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);container-type:inline-size}
.scroller{flex:1;min-height:0;overflow:auto}

/* Month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:100%;grid-auto-rows:auto}
.month .dow{padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.month .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.month .cell:nth-child(7n+7){border-right:0}
.month .cell.other{background:color-mix(in srgb,var(--bg) 55%,var(--surface))}
.month .cell.other .dnum{color:var(--muted)}
.month .cell.today{background:var(--today)}
.month .cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{align-self:flex-start;border:0;background:transparent;font-weight:600;font-size:13px;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;padding:0}
.dnum:hover{background:var(--sel)}
.cell.today .dnum{background:var(--accent);color:var(--accent-ink)}
.more{border:0;background:transparent;text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:1px 4px}

/* Chips and blocks with category colour */
.ev{--c:var(--c-blue);border:0;text-align:left;width:100%;background:color-mix(in srgb,var(--c) 17%,var(--surface));border-left:3px solid var(--c);border-radius:5px;padding:2px 6px;font-size:12px;line-height:1.3;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.ev:hover{background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.ev b{font-weight:600;margin-right:4px;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.c-blue{--c:var(--c-blue)}.c-green{--c:var(--c-green)}.c-orange{--c:var(--c-orange)}.c-red{--c:var(--c-red)}.c-purple{--c:var(--c-purple)}.c-black{--c:var(--c-black)}
.ev.c-black,.ev.c-black:hover{background:var(--c-black);color:var(--surface)}
.ev.c-black:hover{filter:brightness(1.2)}
.ev.c-black b{color:var(--surface)}

/* Week and day */
.sticky{position:sticky;top:0;z-index:4;background:var(--surface)}
.gridrow{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.dayhead{padding:8px 6px;text-align:center;border-left:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-top:0;border-right:0;border-radius:0}
.dayhead .dw{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.dayhead .dn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font:700 18px var(--f-display);margin-top:2px}
.dayhead.today .dn{background:var(--accent);color:var(--accent-ink)}
.dayhead.sel:not(.today) .dn{background:var(--sel)}
.alldayrow .gl,.gutter .hl{font-size:11px;color:var(--muted);text-align:right;padding-right:8px}
.alldayrow{border-bottom:1px solid var(--line)}
.alldayrow .gl{padding-top:6px}
.alldayrow .ac{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:30px}
.gridbody .gutter{position:relative}
.gutter .hl{position:absolute;right:0;width:100%;transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hour));cursor:cell}
.col.today{background-color:var(--today)}
.col .ev{position:absolute;white-space:normal;padding:3px 6px;z-index:1;width:auto;box-shadow:0 0 0 1px var(--surface)}
.col .ev span{display:block;opacity:.85}
.now{position:absolute;left:0;right:0;height:2px;background:var(--c-red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--c-red)}

/* To-do sidebar */
.side{width:340px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease,margin .22s ease}
.side[data-open="false"]{width:0;border-left-width:0}
.side-in{width:340px;display:flex;flex-direction:column;height:100%;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.side-head h2{font:700 17px var(--f-display);margin:0}
.side-scroll{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.sec{margin-top:12px}
.sec h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sec h3 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600}
.todo{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:8px}
.todo:hover{background:var(--bg)}
.todo input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.todo label{flex:1;min-width:0;word-break:break-word;cursor:pointer}
.todo.done label{color:var(--muted);text-decoration:line-through}
.todo .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;border-radius:6px;visibility:hidden}
.todo:hover .x,.todo .x:focus-visible{visibility:visible}
@media (hover:none){.todo .x{visibility:visible}}
.todo .x:hover{color:var(--c-red)}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.empty{color:var(--muted);font-size:13px;padding:4px}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}

/* Dialog */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.on{display:flex}
.dlg{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.dlg h2{margin:0;font:700 18px var(--f-display)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld input[type=email],.fld input[type=password]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.acts .del{margin-right:auto;color:var(--c-red)}
.status{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}

/* Deadlines and repeating to-dos */
.ev.dl{--c:var(--c-red);background:transparent;border:1px dashed var(--c);border-left:3px solid var(--c);color:var(--ink)}
.ev.dl:hover{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.ev.dl.done{--c:var(--c-green);opacity:.6;text-decoration:line-through}
.dlb{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;margin-left:6px;background:var(--bg);color:var(--muted);white-space:nowrap;text-decoration:none;vertical-align:1px}
.dlb.over{background:color-mix(in srgb,var(--c-red) 18%,var(--surface));color:var(--c-red)}
.dlb.today{background:color-mix(in srgb,var(--c-orange) 20%,var(--surface));color:var(--c-orange)}
.dayev.dl{--c:var(--c-red);background:transparent;border:1px dashed var(--c);border-left:4px solid var(--c)}
.dayev.dl.done{opacity:.6}
.dayev.dl.done .n{text-decoration:line-through}

/* Day overview under the calendar (narrow screens, month and week view) */
.dayinfo{display:none;flex:none;max-height:44%;overflow:auto;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px 10px}
@container (max-width:720px){.dayinfo.on{display:block}.month .cell .ev,.month .cell .more,.month .cell .dnum{pointer-events:none}}  /* any tap on a day selects it; open appointments or the day view from the overview below */
.dayinfo h3{margin:0 0 6px;font:700 14px var(--f-display);display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-transform:capitalize}
.dayinfo h3 small{font:500 12px var(--f-body);color:var(--muted);text-transform:none}
.dayev{--c:var(--c-blue);display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:6px;padding:7px 9px;margin-bottom:5px;font-size:14px;color:var(--ink)}
.dayev .t{font-weight:700;flex:none;min-width:6.2em;font-variant-numeric:tabular-nums}
.dayev .n{min-width:0;word-break:break-word}
.dayev.c-black{background:var(--c-black);color:var(--surface)}
.dayact{display:flex;gap:8px;margin-top:6px}

/* Weekday picker for repeating events */
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600;color:var(--ink);cursor:pointer;background:var(--bg)}
.day input{margin:0;accent-color:var(--accent)}
.day:has(input:checked){background:var(--sel);border-color:var(--accent)}
.hint{font-weight:400;color:var(--muted)}

/* Quick add bar */
.quick{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.quick input{flex:1 1 280px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.quick .status{flex:1 1 100%}
.quick .status:empty{display:none}
.quick .status.err{color:var(--c-red)}

/* The calendar adapts to its own width */
@container (max-width:720px){
  .month .dow{padding:6px 2px;font-size:10px;text-align:center}
  .month .cell{padding:2px 3px}
  .dnum{width:22px;height:22px;font-size:12px}
  .ev{font-size:11px;padding:1px 4px}
  .ev b{display:none}
  .gridrow{grid-template-columns:38px repeat(var(--n),minmax(0,1fr))}
  .alldayrow .gl,.gutter .hl{font-size:10px;padding-right:4px}
  .dayhead{padding:6px 2px}
  .dayhead .dw{font-size:10px}
  .dayhead .dn{width:26px;height:26px;font:700 15px var(--f-display)}
}
@container (max-width:460px){
  .month .cell .ev{font-size:0;height:6px;min-height:6px;padding:0;border-left-width:0;border-radius:3px;background:var(--c)}
  .more{font-size:10px;padding:0}
  .col .ev{font-size:10px;padding:1px 3px}
}
/* Narrow screens: sidebar slides over the calendar */
@media (max-width:820px){
  .side{position:absolute;right:0;top:0;bottom:0;z-index:10;box-shadow:var(--shadow);max-width:92vw}
  .side-in{width:min(340px,92vw)}
  .top{padding:10px 12px}
  #syncStatus{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title" id="title">Agenda<small id="subtitle"></small></h1>
    <div class="nav">
      <button class="btn icon" id="prev" aria-label="Vorige">&#8249;</button>
      <button class="btn" id="today">Vandaag</button>
      <button class="btn icon" id="next" aria-label="Volgende">&#8250;</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Weergave">
      <button role="tab" id="tab-month" data-view="month">Maand</button>
      <button role="tab" id="tab-week" data-view="week">Week</button>
      <button role="tab" id="tab-day" data-view="day">Dag</button>
    </div>
    <button class="btn primary" id="newEv">+ Afspraak</button>
    <button class="btn" id="undoBtn" disabled title="Laatste wijziging ongedaan maken (Ctrl+Z)">&#8630; Ongedaan maken</button>
    <button class="btn" id="toggleSide" aria-expanded="true" aria-controls="side">To-do's<span class="badge" id="badge">0</span></button>
    <span class="status" id="syncStatus" role="status" hidden></span>
    <button class="btn" id="syncBtn" hidden>Inloggen</button>
  </header>

  <form class="quick" id="quickForm" autocomplete="off">
    <input type="text" id="quickInput" maxlength="200" aria-label="Snel een afspraak of to-do toevoegen" placeholder="Typ bv.: voeg 'voetbaltraining' toe op 23 november van 19u30-21u">
    <button class="btn primary" type="submit">Toevoegen</button>
    <span class="hint" id="ver" style="font-size:11px">versie 15</span>
    <span class="status" id="quickMsg" role="status"></span>
  </form>

  <div class="main">
    <section class="cal"><div class="scroller" id="scroller"></div><div class="dayinfo" id="dayinfo" aria-live="polite"></div></section>
    <aside class="side" id="side" data-open="true" aria-label="To-do-lijst">
      <div class="side-in">
        <div class="side-head">
          <h2>To-do's</h2>
          <button class="btn icon" id="closeSide" aria-label="To-do-balk sluiten">&#10005;</button>
        </div>
        <div class="side-scroll" id="todos"></div>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim">
  <form class="dlg" id="form" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle">Nieuwe afspraak</h2>
    <label class="fld">Titel<input type="text" id="f-title" required maxlength="120" autocomplete="off"></label>
    <div class="row2">
      <label class="fld">Datum<input type="date" id="f-date" required></label>
      <label class="chk" style="align-self:end;padding-bottom:9px"><input type="checkbox" id="f-all"> Hele dag</label>
    </div>
    <div class="row2" id="timeRow">
      <label class="fld">Van<input type="time" id="f-start" value="09:00"></label>
      <label class="fld">Tot<input type="time" id="f-end" value="10:00"></label>
    </div>
    <div class="fld">Herhalen op <span class="hint">(optioneel, vanaf de gekozen datum)</span>
      <div class="days" id="days">
        <label class="day"><input type="checkbox" value="1">ma</label>
        <label class="day"><input type="checkbox" value="2">di</label>
        <label class="day"><input type="checkbox" value="3">wo</label>
        <label class="day"><input type="checkbox" value="4">do</label>
        <label class="day"><input type="checkbox" value="5">vr</label>
        <label class="day"><input type="checkbox" value="6">za</label>
        <label class="day"><input type="checkbox" value="0">zo</label>
      </div>
    </div>
    <label class="fld" id="untilRow">Herhalen tot <span class="hint">(optioneel, anders blijft het doorlopen)</span><input type="date" id="f-until"></label>
    <div class="fld">Kleur <span class="hint">(afspraken met "werk" in de titel zijn altijd zwart)</span>
      <div class="swatches" role="radiogroup" aria-label="Kleur" id="swatches">
        <button type="button" class="sw c-blue" role="radio" data-c="blue" aria-label="Blauw"></button>
        <button type="button" class="sw c-green" role="radio" data-c="green" aria-label="Groen"></button>
        <button type="button" class="sw c-orange" role="radio" data-c="orange" aria-label="Oranje"></button>
        <button type="button" class="sw c-red" role="radio" data-c="red" aria-label="Rood"></button>
        <button type="button" class="sw c-purple" role="radio" data-c="purple" aria-label="Paars"></button>
        <button type="button" class="sw c-black" role="radio" data-c="black" aria-label="Zwart"></button>
      </div>
    </div>
    <div class="acts">
      <button type="button" class="btn del" id="f-del">Verwijderen</button>
      <button type="button" class="btn" id="f-cancel">Annuleren</button>
      <button type="submit" class="btn primary">Opslaan</button>
    </div>
  </form>
</div>

<div class="scrim" id="loginScrim">
  <form class="dlg" id="loginForm" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Inloggen</h2>
    <label class="fld">E-mailadres<input type="email" id="l-email" required autocomplete="username"></label>
    <label class="fld">Wachtwoord<input type="password" id="l-pass" required autocomplete="current-password"></label>
    <div class="status" id="loginMsg" role="status"></div>
    <div class="acts">
      <button type="button" class="btn" id="l-cancel">Annuleren</button>
      <button type="submit" class="btn primary">Inloggen</button>
    </div>
  </form>
</div>

<script>
(function(){
"use strict";
var APP_VERSION=15; /* raise on every release: open pages notice it and reload themselves */
var HOUR=52, KEY="agenda-v1", UIKEY="agenda-ui-v1";
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,"0")};
var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var parse=function(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
var mondayOf=function(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
var toMin=function(t){var p=(t||"0:0").split(":");return (+p[0])*60+(+p[1]||0)};
var fromMin=function(m){m=Math.max(0,Math.min(1439,m));return pad(Math.floor(m/60))+":"+pad(m%60)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,10)};

var fMonth=fmt({month:"long",year:"numeric"}), fLong=fmt({weekday:"long",day:"numeric",month:"long",year:"numeric"});
var fDm=fmt({day:"numeric",month:"short"}), fDmy=fmt({day:"numeric",month:"short",year:"numeric"});
var fDow=fmt({weekday:"short"}), fSide=fmt({weekday:"long",day:"numeric",month:"long"});
function isoWeek(s){var d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

/* Cloud sync (Supabase). Leave URL or key empty to keep everything on this device only. */
var SUPABASE_URL="https://xvuqcmmxarvkpcetztno.supabase.co";
var SUPABASE_KEY="sb_publishable_OSzi_SMjJuKx9nDrA7UIfA_telqAWBY";
var DIRTYKEY="agenda-dirty-v1", SYNCEDKEY="agenda-synced-user-v1";
var sync={client:null,user:null,busy:false,timer:null,ver:0};
function isDirty(){try{return localStorage.getItem(DIRTYKEY)==="1"}catch(e){return false}}
function setDirty(v){try{v?localStorage.setItem(DIRTYKEY,"1"):localStorage.removeItem(DIRTYKEY)}catch(e){}}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
/* Call after every real change: store locally, mark as not yet uploaded, upload shortly after */
/* Undo: every save() remembers the state from before the change (this session only, last 50 changes) */
var undoStack=[], lastSnap=JSON.stringify(data);
function updateUndoBtn(){
  var n=undoStack.length;
  $("#undoBtn").disabled=n===0;
  $("#undoBtn").innerHTML="&#8630; Ongedaan maken"+(n?" ("+n+")":"");
}
function resetUndo(){undoStack=[];lastSnap=JSON.stringify(data);updateUndoBtn()}
function save(){
  var now=JSON.stringify(data);
  if(now!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>50)undoStack.shift();lastSnap=now}
  persistLocal();sync.ver++;setDirty(true);schedulePush();updateUndoBtn();
}
function undo(){
  if(!undoStack.length)return;
  var snap=undoStack.pop();
  data=JSON.parse(snap);lastSnap=snap;
  persistLocal();sync.ver++;setDirty(true);schedulePush();updateUndoBtn();renderAll();
  var msg=$("#quickMsg");msg.classList.remove("err");msg.textContent="Laatste wijziging ongedaan gemaakt."+(undoStack.length?" Klik opnieuw om nog een stap terug te gaan.":"");
}
function setStatus(t){$("#syncStatus").textContent=t}
function updateSyncUi(){
  $("#syncBtn").textContent=sync.user?"Uitloggen":"Inloggen";
  if(!sync.user)setStatus("Alleen op dit apparaat");
}
function schedulePush(){
  if(!sync.user)return;
  clearTimeout(sync.timer);sync.timer=setTimeout(push,800);
}
function push(){
  if(!sync.user)return Promise.resolve();
  var ver=sync.ver;
  setStatus("Opslaan…");
  return sync.client.from("agenda_data").upsert({user_id:sync.user.id,data:data,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error)throw r.error;
    if(ver===sync.ver)setDirty(false); /* nothing changed while uploading */
    try{localStorage.setItem(SYNCEDKEY,sync.user.id)}catch(e){}
    setStatus("Gesynchroniseerd");
  }).catch(function(){setStatus("Niet gesynchroniseerd (offline?)")});
}
/* Add local items that the cloud copy does not have yet (used the first time a device logs in) */
function union(remote,local){
  ["events","todos"].forEach(function(k){
    var ids={};remote[k].forEach(function(x){ids[x.id]=1});
    local[k].forEach(function(x){if(!ids[x.id]&&!x.seed)remote[k].push(x)});
  });
  remote.applied=(remote.applied||[]).concat((local.applied||[]).filter(function(id){return (remote.applied||[]).indexOf(id)<0}));
  return remote;
}
function pull(){
  if(!sync.user||sync.busy||$("#scrim").classList.contains("on"))return Promise.resolve();
  sync.busy=true;setStatus("Synchroniseren…");
  return sync.client.from("agenda_data").select("data").maybeSingle().then(function(r){
    if(r.error)throw r.error;
    var remote=r.data&&r.data.data;
    var valid=remote&&Array.isArray(remote.events)&&Array.isArray(remote.todos);
    var known=localStorage.getItem(SYNCEDKEY)===sync.user.id;
    if(!valid||(known&&isDirty()))return push();      /* nothing in the cloud yet, or local changes win */
    data=known?remote:union(remote,data);              /* first login on this device merges both */
    if(applyPresets())sync.ver++;
    persistLocal();resetUndo();renderAll();
    if(!known||isDirty())return push();
    setStatus("Gesynchroniseerd");
  }).catch(function(){setStatus("Niet gesynchroniseerd (offline?)")}).then(function(){sync.busy=false});
}
function closeLogin(){$("#loginScrim").classList.remove("on")}
function initCloud(){
  if(!SUPABASE_URL||!SUPABASE_KEY)return;
  $("#syncBtn").hidden=false;$("#syncStatus").hidden=false;updateSyncUi();
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
  s.onerror=function(){setStatus("Cloud niet bereikbaar")};
  s.onload=function(){
    sync.client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    sync.client.auth.onAuthStateChange(function(ev,session){
      sync.user=session?session.user:null;updateSyncUi();
      /* do not call Supabase inside this callback: defer */
      if(sync.user&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"))setTimeout(pull,0);
    });
  };
  document.head.appendChild(s);
  $("#syncBtn").addEventListener("click",function(){
    if(!sync.client){setStatus("Cloud-bibliotheek niet geladen (controleer je internetverbinding)");return}
    if(sync.user){sync.client.auth.signOut();return}
    $("#loginMsg").textContent="";$("#loginScrim").classList.add("on");
    setTimeout(function(){$("#l-email").focus()},0);
  });
  $("#l-cancel").addEventListener("click",closeLogin);
  $("#loginForm").addEventListener("submit",function(e){
    e.preventDefault();$("#loginMsg").textContent="Bezig met inloggen…";
    sync.client.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pass").value}).then(function(r){
      if(r.error){$("#loginMsg").textContent="Inloggen mislukt: "+r.error.message;return}
      $("#l-pass").value="";closeLogin();
    }).catch(function(err){$("#loginMsg").textContent="Geen verbinding met de server: "+(err&&err.message||err)});
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeLogin()});
  document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
  window.addEventListener("online",pull);
}

/* Events added on your behalf; each one is added to the calendar only once. Returns true if something was added. */
var PRESETS=[
  {id:"p-babyborrel-20261121",title:"Baby borrel L & B",date:"2026-11-21",start:"15:00",end:"17:00",allDay:false,color:"orange"}
];
function applyPresets(){
  var added=false;
  data.applied=data.applied||[];
  PRESETS.forEach(function(p){if(data.applied.indexOf(p.id)<0){data.applied.push(p.id);data.events.push(Object.assign({},p));added=true}});
  return added;
}
if(applyPresets())save();else persistLocal();
resetUndo();

/* Helpers */
/* An event with repeat:{days:[0-6],until:date|null} occurs on the chosen weekdays, from its start date until the end date */
function occursOn(e,d){
  if(!e.repeat)return e.date===d;
  if(d<e.date||(e.repeat.until&&d>e.repeat.until))return false;
  return e.repeat.days.indexOf(parse(d).getDay())>=0;
}
function eventsOn(d){
  return data.events.filter(function(e){return occursOn(e,d)}).sort(function(a,b){
    return (b.allDay?1:0)-(a.allDay?1:0)||toMin(a.start)-toMin(b.start)});
}
function timeLabel(e){return e.allDay?"":e.start}
/* Appointments with "werk" in the title (werk, werkoverleg, ...) are always shown in black */
function colorOf(e){return /\bwerk/i.test(e.title)?"black":e.color}
function evChip(e){
  return '<button class="ev c-'+esc(colorOf(e))+'" data-ev="'+e.id+'" title="'+esc(e.title)+'">'+(e.allDay?"":"<b>"+e.start+"</b>")+(e.repeat?"\u21bb ":"")+esc(e.title)+"</button>";
}
function visibleDays(){
  if(ui.view==="day")return [ui.cursor];
  var m=mondayOf(ui.cursor),a=[];for(var i=0;i<7;i++)a.push(addDays(m,i));return a;
}

/* Header */

/* Month */

  var first=ui.cursor.slice(0,8)+"01";
  var start=mondayOf(first);

  var html='<div class="month" style="grid-template-rows:auto repeat('+rows+',minmax(0,1fr))">';

  var curMonth=ui.cursor.slice(0,7);
  for(var i=0;i<rows*7;i++){
    var d=addDays(start,i),evs=eventsOn(d).map(evChip).concat(deadlinesOn(d).map(dlChip));
    var cls="cell"+(d.slice(0,7)!==curMonth?" other":"")+(d===todayStr?" today":"")+(d===ui.cursor?" sel":"");
    html+='<div class="'+cls+'" data-day="'+d+'"><button class="dnum" data-goday="'+d+'" aria-label="'+fLong(d)+'">'+parse(d).getDate()+"</button>";
    evs.slice(0,3).forEach(function(c){html+=c});
    if(evs.length>3)html+='<button class="more" data-goday="'+d+'">+'+(evs.length-3)+" meer</button>";
    html+="</div>";
  }
  $("#scroller").innerHTML=html+"</div>";

/* Week / day */
function pack(list){
  list.sort(function(a,b){return a.s-b.s||b.t-a.t});
  var out=[],cl=[],end=-1;
  function flush(){var cols=[];cl.forEach(function(it){var c=cols.findIndex(function(x){return x<=it.s});if(c<0){c=cols.length;cols.push(0)}cols[c]=it.t;it.col=c});cl.forEach(function(it){it.n=cols.length});out=out.concat(cl);cl=[]}
  list.forEach(function(it){if(cl.length&&it.s>=end){flush();end=-1}cl.push(it);end=Math.max(end,it.t)});
  if(cl.length)flush();return out;
}
function renderGrid(){
  var days=visibleDays(),n=days.length,sc=$("#scroller"),prev=sc.scrollTop;
  var first=!sc.querySelector(".gridrow");
  var oldHour=HOUR;
  HOUR=Math.max(34,Math.min(72,Math.round((sc.clientHeight-80)/12)));
  prev=prev*HOUR/oldHour;
  var html='<div class="sticky"><div class="gridrow" style="--n:'+n+'"><div></div>';
  days.forEach(function(d){
    html+='<button class="dayhead'+(d===todayStr?" today":"")+(d===ui.cursor?" sel":"")+'" data-pick="'+d+'"><span class="dw">'+fDow(d)+'</span><span class="dn">'+parse(d).getDate()+"</span></button>";
  });
  html+='</div><div class="gridrow alldayrow" style="--n:'+n+'"><div class="gl">hele dag</div>';
  days.forEach(function(d){
    html+='<div class="ac" data-new-all="'+d+'">'+eventsOn(d).filter(function(e){return e.allDay}).map(evChip).join("")+deadlinesOn(d).map(dlChip).join("")+"</div>";
  });
  html+="</div></div>";
  html+='<div class="gridrow gridbody" style="--n:'+n+';--hour:'+HOUR+'px"><div class="gutter" style="height:'+(24*HOUR)+'px">';
  for(var hr=1;hr<24;hr++)html+='<div class="hl" style="top:'+(hr*HOUR)+'px">'+pad(hr)+":00</div>";
  html+="</div>";
  var nowMin=new Date().getHours()*60+new Date().getMinutes();
  days.forEach(function(d){
    var items=eventsOn(d).filter(function(e){return !e.allDay}).map(function(e){
      var s=toMin(e.start),t=Math.max(toMin(e.end),s+30);return {e:e,s:s,t:t}});
    html+='<div class="col'+(d===todayStr?" today":"")+'" data-col="'+d+'" style="height:'+(24*HOUR)+'px">';
    pack(items).forEach(function(it){
      var top=it.s/60*HOUR,hgt=Math.max((it.t-it.s)/60*HOUR-2,20),w=100/it.n;
      html+='<button class="ev c-'+esc(colorOf(it.e))+'" data-ev="'+it.e.id+'" style="top:'+top+"px;height:"+hgt+"px;left:calc("+(it.col*w)+"% + 2px);width:calc("+w+'% - 4px)" title="'+esc(it.e.title)+'"><b>'+it.e.start+"</b>"+(it.e.repeat?"\u21bb ":"")+esc(it.e.title)+"</button>";
    });
    if(d===todayStr)html+='<div class="now" style="top:'+(nowMin/60*HOUR)+'px"></div>';
    html+="</div>";
  });
  html+="</div>";
  sc.innerHTML=html;
  sc.scrollTop=first?7*HOUR:prev;
}

function renderCal(){ui.view==="month"?renderMonth():renderGrid()}

/* To-dos */
/* A to-do can repeat (daily or on chosen weekdays, with a check per day) and/or have a deadline shown in the calendar */
function todoOccursOn(t,d){
  if(!t.repeat)return t.date===d;
  if(d<t.date||(t.repeat.until&&d>t.repeat.until))return false;
  return t.repeat.days.indexOf(parse(d).getDay())>=0;
}
function todosForDay(d){return data.todos.filter(function(t){return todoOccursOn(t,d)})}
function isDone(t,d){return t.repeat?(t.doneDates||[]).indexOf(d)>=0:!!t.done}
function setDone(t,d,v){
  if(t.repeat){t.doneDates=(t.doneDates||[]).filter(function(x){return x!==d});if(v)t.doneDates.push(d)}
  else t.done=v;
}
function deadlinesOn(d){return data.todos.filter(function(t){return t.deadline===d})}
function dlChip(t){
  return '<button class="ev dl'+(t.done?" done":"")+'" data-dltodo="'+t.id+'" title="Deadline: '+esc(t.text)+' (klik om af te vinken)">'+(t.done?"✓ ":"⚑ ")+esc(t.text)+"</button>";
}
function toggleDeadline(id){
  var x=data.todos.find(function(t){return t.id===id});
  if(x){x.done=!x.done;save();renderAll()}
}
function todoItem(x){
  var done=isDone(x,ui.cursor),badge="";
  if(x.repeat)badge+='<span class="dlb">↻ '+(x.repeat.days.length===7?"elke dag":repeatLabel(x.repeat).replace("elke ",""))+"</span>";
  if(x.deadline){
    var cls=!done&&x.deadline<todayStr?" over":(!done&&x.deadline===todayStr?" today":"");
    badge+='<span class="dlb'+cls+'">⚑ '+fDm(x.deadline)+"</span>";
  }
  return '<div class="todo'+(done?" done":"")+'"><input type="checkbox" id="t-'+x.id+'" data-todo="'+x.id+'"'+(done?" checked":"")+'><label for="t-'+x.id+'">'+esc(x.text)+badge+'</label><button class="x" data-deltodo="'+x.id+'" aria-label="Verwijder '+esc(x.text)+'">&times;</button></div>';
}
function renderTodos(){
  var day=todosForDay(ui.cursor);
  var gen=data.todos.filter(function(x){return !x.date&&!x.repeat}).sort(function(a,b){
    return (a.deadline||"9999")<(b.deadline||"9999")?-1:(a.deadline||"9999")>(b.deadline||"9999")?1:0});
  var dd=day.filter(function(x){return isDone(x,ui.cursor)}).length, gd=gen.filter(function(x){return x.done}).length;

function renderAll(){renderHead();renderDayInfo();renderCal();renderTodos();applySide()}

/* Navigation */
function shift(dir){

  if(R.length)kept.push(piece(a,u,R));
  if(I.length){
    if(!sel)target.push(piece(a,u,I));
    else{
      if(hasFrom){var bEnd=addDays(sel.from,-1);if(u&&u<bEnd)bEnd=u;if(a<=bEnd)kept.push(piece(a,bEnd,I))}
      var mS=hasFrom&&sel.from>a?sel.from:a;
      var mE=hasTo?((u&&u<sel.to)?u:sel.to):u;
      if(!mE||mS<=mE)target.push(piece(mS,mE,I));
      if(hasTo){var aS=addDays(sel.to,1);if(aS<a)aS=a;if(!u||aS<=u)kept.push(piece(aS,u,I))}
    }
  }
  kept=kept.map(tidy).filter(Boolean);target=target.map(tidy).filter(Boolean);
  if(!target.length)return {kept:[h],target:[]};
  kept.concat(target).forEach(function(p,i){p.id=i?uid():h.id});
  return {kept:kept,target:target};
}
/* Human-readable description of what was selected, e.g. "op ma, di, van 30 november t.e.m. 4 december" */
function selLabel(sel,scope){
  var parts=[];
  if(scope)parts.push("op "+repeatLabel({days:scope}).replace("elke ",""));
  if(sel){
    if(sel.from&&sel.from===sel.to)parts.push("op "+fLong(sel.from));
    else if(sel.from&&sel.to)parts.push("van "+fLong(sel.from)+" t.e.m. "+fLong(sel.to));
    else if(sel.from)parts.push("vanaf "+fLong(sel.from));
    else parts.push("t.e.m. "+fLong(sel.to));
  }
  return parts.join(", ");
}
/* Change existing appointments whose title matches; returns {error} or {n,first,merged,label}.
   Selection: weekdays ("elke ma, di, do") and/or a day or period ("op 25 november", "van X tot Y", "vanaf X");
   only that part changes and a series is split so the rest keeps its old settings.
   Weekdays alone (no other change, no period) set the days of the series. */
function modifyEvents(r){
  var t=r.title.toLowerCase();
  var hits=data.events.filter(function(e){return e.title.toLowerCase()===t});
  if(!hits.length)hits=data.events.filter(function(e){return e.title.toLowerCase().indexOf(t)>=0});
  if(!hits.length)return {error:"Ik vond geen afspraak met '"+r.title+"'."};
  var sel=r.sel;
  if(r.clearRepeat&&sel&&sel.from&&sel.from===sel.to&&!r.date){r.date=sel.from;sel=null} /* "niet meer herhalen op 25 november" */
  var others=!!(r.newTitle||r.hasTime||r.setAllDay||r.clearRepeat||r.untilGiven||r.date||r.color);
  if(!others&&!r.repeat&&!sel)
    return {error:"Zeg wat je wilt aanpassen, bv. aanpassen '"+r.title+"' van 9u-17u"};
  if(!others&&sel)
    return {error:"Zeg wat er op die dag of in die periode moet veranderen, bv. aanpassen '"+r.title+"' op 25 november van 9u-12u"};
  var setDays=!!(r.repeat&&!others);
  var scope=(r.repeat&&others)?r.repeat.days:null;
  if((scope||sel)&&r.clearRepeat)return {error:"Combineer 'niet meer herhalen' niet met weekdagen of een periode."};
  /* apply the requested changes to a copy; returns an error text or null */
  function apply(e,withDays){
    if(r.newTitle)e.title=r.newTitle;
    if(r.hasTime){e.start=r.start;e.end=r.end;e.allDay=false}
    if(r.setAllDay){e.allDay=true;e.start="00:00";e.end="23:59"}
    if(r.date)e.date=r.date;
    if(r.color)e.color=r.color;
    if(r.clearRepeat)delete e.repeat;
    else if(r.repeat&&withDays)e.repeat={days:r.repeat.days,until:r.untilGiven?r.until:(e.repeat?e.repeat.until:null)};
    else if(r.untilGiven){
      if(!e.repeat)return "'"+e.title+"' wordt niet herhaald, dus een einddatum past hier niet.";
      e.repeat.until=r.until;
    }
    if(e.repeat&&e.repeat.until&&e.repeat.until<e.date)return "De einddatum ligt voor de startdatum.";
    return null;
  }
  var map={},first=null,touched=0,err,e;
  for(var i=0;i<hits.length;i++){
    var h=hits[i];
    if(setDays){
      e=JSON.parse(JSON.stringify(h));err=apply(e,true);if(err)return {error:err};
      map[h.id]=[e];touched++;first=first||e;continue;
    }
    var sp=splitEvent(h,sel,scope);
    if(!sp.target.length){map[h.id]=[h];continue}
    var changed=[];
    for(var k=0;k<sp.target.length;k++){
      e=JSON.parse(JSON.stringify(sp.target[k]));err=apply(e,false);if(err)return {error:err};
      changed.push(e);
    }
    map[h.id]=sp.kept.concat(changed);touched++;first=first||changed[0];
  }
  if(!touched)return {error:"Ik vond geen '"+r.title+"' "+selLabel(sel,scope)+"."};
  var flat=[];
  data.events.forEach(function(x){if(Object.prototype.hasOwnProperty.call(map,x.id))Array.prototype.push.apply(flat,map[x.id]);else flat.push(x)});
  /* merge identical results (same title, first day, time, colour and repeat) */
  var seen={},merged=0,derived=[];
  Object.keys(map).forEach(function(k){Array.prototype.push.apply(derived,map[k])});
  flat=flat.filter(function(x){
    if(derived.indexOf(x)<0)return true;
    var key=JSON.stringify([x.title,firstOn(x),x.start,x.end,x.allDay,x.color,x.repeat||null]);
    if(seen[key]){merged++;return false}
    seen[key]=1;return true;
  });
  data.events=flat;
  return {n:touched,first:first,merged:merged,label:selLabel(sel,scope)};
}
/* Delete appointments with exactly this title; with weekdays and/or a day or period only that part of a series. */
function deleteEvents(r){
  var t=r.title.toLowerCase(),sel=r.sel,scope=r.repeat?r.repeat.days:null;
  var hits=data.events.filter(function(e){return e.title.toLowerCase()===t});
  if(!hits.length)return {error:"Ik vond geen afspraak met precies de titel '"+r.title+"'."};
  var map={},touched=0;
  hits.forEach(function(h){
    var sp=splitEvent(h,sel,scope);
    if(!sp.target.length)return;
    map[h.id]=sp.kept;touched++;
  });
  if(!touched)return {error:"Ik vond geen '"+r.title+"' "+selLabel(sel,scope)+"."};
  var flat=[];
  data.events.forEach(function(x){if(Object.prototype.hasOwnProperty.call(map,x.id))Array.prototype.push.apply(flat,map[x.id]);else flat.push(x)});
  data.events=flat;
  return {n:touched,label:selLabel(sel,scope)};
}
function repeatLabel(rp){
  if(rp.days.length===7)return "elke dag";
  return "elke "+rp.days.slice().sort(function(x,y){return (x+6)%7-(y+6)%7}).map(function(x){return SHORT_DAYS[x]}).join(", ");
}
$("#quickForm").addEventListener("submit",function(e){
  e.preventDefault();
  var inp=$("#quickInput"),msg=$("#quickMsg"),v=inp.value.trim();if(!v)return;
  var r=parseQuick(v);
  msg.classList.toggle("err",!!r.error);
  if(r.error){msg.textContent=r.error;return}
  var when=r.allDay?"hele dag":r.start+"–"+r.end;
  if(r.kind==="modify"){
    var res=modifyEvents(r);
    msg.classList.toggle("err",!!res.error);
    if(res.error){msg.textContent=res.error;return}
    ui.cursor=firstOn(res.first);
    msg.textContent="Aangepast"+(res.n>1?" ("+res.n+" afspraken)":"")+(res.label?" (alleen "+res.label+")":"")+": "+res.first.title+" \u2014 "+describeEvent(res.first)
      +(res.merged?". "+res.merged+" dubbele "+(res.merged>1?"afspraken":"afspraak")+" samengevoegd.":"");
  }else if(r.kind==="delete"){
    var del=deleteEvents(r);
    msg.classList.toggle("err",!!del.error);
    if(del.error){msg.textContent=del.error;return}
    msg.textContent=(del.label
      ? "Verwijderd: '"+r.title+"' "+del.label+(del.n>1?" ("+del.n+" afspraken)":"")
      : "Verwijderd: alle afspraken met de titel '"+r.title+"'"+(del.n>1?" ("+del.n+")":""))+". Klik op Ongedaan maken om dit terug te zetten.";
  }else if(r.kind==="todo"){
    var td={id:uid(),text:r.title,done:false,date:r.date};
    if(r.deadline)td.deadline=r.deadline;
    if(r.repeat){td.repeat=r.repeat;td.doneDates=[]}
    data.todos.push(td);
    if(r.date)ui.cursor=r.date;else if(r.deadline)ui.cursor=r.deadline;
    msg.textContent="To-do toegevoegd: "+r.title+(r.repeat
      ? " \u2014 "+repeatLabel(r.repeat)+(r.repeat.until?" tot "+fLong(r.repeat.until):"")
      : (r.date?" ("+fLong(r.date)+")":" (algemeen)"))+(r.deadline?", deadline "+fLong(r.deadline):"");
  }else{
    var ev={id:uid(),title:r.title,date:r.date,start:r.allDay?"00:00":r.start,end:r.allDay?"23:59":r.end,allDay:r.allDay,color:r.color||"blue"};
    var first=r.date;
    if(r.repeat){
      ev.repeat=r.repeat;
      for(var i=0;i<7;i++){var c=addDays(r.date,i);if(r.repeat.days.indexOf(parse(c).getDay())>=0){first=c;break}}
    }
    data.events.push(ev);
    ui.cursor=first;
    msg.textContent="Toegevoegd: "+r.title+" — "+(r.repeat
      ? repeatLabel(r.repeat)+", "+when+", vanaf "+fLong(first)+(r.repeat.until?" tot "+fLong(r.repeat.until):"")
      : fLong(r.date)+", "+when);
    if(r.color)msg.textContent+=", "+COLOR_NL[colorOf(ev)]+(colorOf(ev)==="black"&&r.color!=="black"?" (afspraken met 'werk' zijn altijd zwart)":"");
  }
  inp.value="";save();renderAll();
});

/* Auto-update: when served over http(s), look for a newer version of this page (bypassing the browser cache)
   and load it, unless the user is typing or a dialog is open. */
function checkUpdate(){
  if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
  var base=location.origin+location.pathname;
  fetch(base+"?check="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():""}).then(function(t){
    var m=t.match(/APP_VERSION=(\d+);/);
    if(!m||+m[1]<=APP_VERSION)return;
    if($("#scrim").classList.contains("on")||$("#loginScrim").classList.contains("on")||$("#quickInput").value)return;
    try{if(sessionStorage.getItem("agenda-updated-to")===m[1])return;sessionStorage.setItem("agenda-updated-to",m[1])}catch(e){}
    location.replace(base+"?v="+m[1]);
  }).catch(function(){});
}
setTimeout(checkUpdate,3000);
/* Installable app: the service worker keeps the app available offline */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
setInterval(checkUpdate,300000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate()});

/* Redraw when the window or calendar changes size */
var rt=null,lastW=0,lastH=0;
function onSize(){
  var sc=$("#scroller");if(!sc)return;
  if(sc.clientWidth===lastW&&sc.clientHeight===lastH)return;
  lastW=sc.clientWidth;lastH=sc.clientHeight;
  clearTimeout(rt);rt=setTimeout(function(){if(ui.view!=="month")renderGrid()},80);
}
if(window.ResizeObserver){new ResizeObserver(onSize).observe($("#scroller"))}
window.addEventListener("resize",onSize);
})();
